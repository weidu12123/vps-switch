[package]
name = "vps-switch-gpui"
version = "0.1.2"
edition = "2024"
publish = false

[[bin]]
name = "vps-switch-gpui"
path = "src/main.rs"

[dependencies]
# 整个 GPUI 栈只有一个依赖入口：gpui-kit = GPUI + 组件 + 图标。
# 它内部精确锁 `gpui-pre = 0.3.9`（Zed 的周更快照），不要在这里写 gpui 本身。
gpui-kit = "=0.7.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
# 客户端网络层跑在专用线程的 current_thread 运行时上（与 shell-rs 同款），
# 不碰 GPUI 自己的 executor。
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
# 终端：与守护进程同版本的 VTE 解析器；客户端拿 WS 字节流自己再解析一遍
# （与浏览器里 xterm.js 的地位相同）。
alacritty_terminal = "0.26"
tokio-tungstenite = "0.28"
futures-util = "0.3"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
# 无头 UI 测试。用 gpui-base / gpui-component 的 test_support（只用公共
# GPUI API）而不是 gpui-kit 的 test-support：后者的 feature 会拉入
# gpui-fast 系列，与 gpui-pre 0.3.9 的依赖树版本冲突（cocoa /
# unicode-properties），解析直接失败。
gpui-base = { version = "=0.7.3", features = ["test-support"] }
gpui-component = { version = "=0.7.3", features = ["test-support"] }
